<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隨機分組器 | 配記</title>
    <style>
        body { margin:0; background:#F8FAFC; color:#1E293B; font-family:-apple-system, sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding: 80px 20px 20px; box-sizing: border-box; }
        * { box-sizing: border-box; }
        
        .top-nav { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .nav-btn { pointer-events: auto; background: rgba(0, 102, 255, 0.9); backdrop-filter: blur(10px); color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; }
        .nav-btn:active { transform: scale(0.95); }

        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 800px; }
        h1 { text-align: center; color: #0066FF; margin-top: 0; }
        
        .mode-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #F1F5F9; padding: 5px; border-radius: 12px; }
        .mode-btn { flex: 1; border: none; padding: 10px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; background: transparent; color: #64748B; transition: 0.2s; }
        .mode-btn.active { background: white; color: #0066FF; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .input-area { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        textarea { width: 100%; height: 140px; padding: 15px; border-radius: 12px; border: 2px solid #E2E8F0; font-size: 1rem; resize: vertical; outline: none; }
        textarea:focus, input:focus { border-color: #0066FF; }
        
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .controls input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #E2E8F0; font-size: 1rem; }
        .auto-input-wrap { display: flex; align-items: center; gap: 10px; }
        .auto-input-wrap input { width: 80px; text-align: center; }

        .btn-main { width: 100%; background: #0066FF; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,102,255,0.2); margin-top: 15px; }
        .btn-main:active { transform: scale(0.98); }

        .hint-text { font-size: 0.85rem; color: #64748B; margin-top: 5px; }

        #result-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .group-card { background: #F1F5F9; border-radius: 15px; padding: 20px; border-top: 5px solid #0066FF; animation: popIn 0.4s ease-out; }
        .group-card h3 { margin: 0 0 10px 0; color: #334155; border-bottom: 1px solid #E2E8F0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .group-card h3 span { font-size: 0.85rem; font-weight: normal; color: #64748B; }
        .group-card ul { margin: 0; padding-left: 20px; color: #475569; line-height: 1.8; font-weight: 500; }
        
        .warning-card { border-top-color: #EF4444 !important; background: #FEF2F2; }
        .warning-card h3 { color: #991B1B; }

        @keyframes popIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: white; color: #333; padding: 30px; border-radius: 20px; max-width: 400px; }
        .modal-content h2 { margin-top: 0; color: #0066FF; }
        .close-btn { width: 100%; background: #0066FF; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 首頁</a>
        <button class="nav-btn" onclick="toggleInfo(event)">ℹ️ 說明書</button>
    </div>

    <div class="container">
        <h1>👥 隨機分組器</h1>

        <div class="mode-switch">
            <button class="mode-btn active" id="btn-mode-auto" onclick="switchMode('auto')">⚡ 平均分組</button>
            <button class="mode-btn" id="btn-mode-custom" onclick="switchMode('custom')">🎯 自訂每組人數 / 組名</button>
        </div>

        <div class="input-area">
            <label style="font-weight: bold; color: #475569;">輸入名單 (每行一個名字)：</label>
            <textarea id="namesList" placeholder="陳大文&#10;李小明&#10;張美玲..."></textarea>
        </div>

        <!-- 模式 1：平均組數 -->
        <div id="mode-auto-sec">
            <div class="auto-input-wrap">
                <label style="font-weight: bold; color: #475569;">分幾多組？</label>
                <input type="number" id="groupCount" value="4" min="1">
            </div>
        </div>

        <!-- 模式 2：自訂人數/組名 -->
        <div id="mode-custom-sec" style="display: none;">
            <label style="font-weight: bold; color: #475569;">輸入各組人數或組名 (以逗號分隔)：</label>
            <input type="text" id="customConfig" placeholder="例：Week 5:3, Week 6:4, Week 7:4, Week 8:3 或 3,4,4,3">
            <div class="hint-text">💡 格式範例：<code>Week 5:3, Week 6:4, Week 7:4, Week 8:3</code>，若不填組名可直接寫 <code>3,4,4,3</code>。</div>
        </div>

        <button class="btn-main" onclick="generateGroups()">開始隨機分配 🎲</button>

        <div id="result-area"></div>
    </div>

    <div id="infoModal" class="modal" onclick="toggleInfo(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>👥 隨機分組器</h2>
            <p><strong>應用場景：</strong></p>
            <p>1. <strong>Presentation 順序：</strong> 使用「自訂人數/組名」模式，輸入各週名額（例：Week 5:3, Week 6:4...），一鍵公平抽籤。<br>
               2. <strong>小組/工作坊：</strong> 平均分組，避免參加者「小圈子」圍爐。<br>
               3. <strong>義工更表：</strong> 隨機分配崗位人數，確保公平公正。</p>
            <button class="close-btn" onclick="toggleInfo(event)">明白</button>
        </div>
    </div>

    <script>
        let currentMode = 'auto';

        function toggleInfo(e) {
            if(e) e.stopPropagation();
            const modal = document.getElementById('infoModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'auto');
            document.getElementById('btn-mode-custom').classList.toggle('active', mode === 'custom');
            document.getElementById('mode-auto-sec').style.display = mode === 'auto' ? 'block' : 'none';
            document.getElementById('mode-custom-sec').style.display = mode === 'custom' ? 'block' : 'none';
        }

        function generateGroups() {
            const text = document.getElementById('namesList').value;
            const names = text.split('\n').map(n => n.trim()).filter(n => n !== '');
            const resultArea = document.getElementById('result-area');
            
            if(names.length === 0) return alert("請先輸入名單！");

            // 洗牌演算法 (Fisher-Yates)
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }

            let finalGroups = [];
            let unassigned = [];

            if (currentMode === 'auto') {
                const numGroups = parseInt(document.getElementById('groupCount').value);
                if(isNaN(numGroups) || numGroups < 1 || numGroups > names.length) {
                    return alert("請輸入合理的組數！");
                }
                
                finalGroups = Array.from({ length: numGroups }, (_, i) => ({
                    title: `第 ${i + 1} 組`,
                    members: []
                }));

                names.forEach((name, index) => {
                    finalGroups[index % numGroups].members.push(name);
                });
            } else {
                const rawConfig = document.getElementById('customConfig').value.trim();
                if(!rawConfig) return alert("請輸入自訂人數或組名！");

                const items = rawConfig.split(/[,，]/).map(s => s.trim()).filter(Boolean);
                let pointer = 0;

                items.forEach((item, idx) => {
                    let title = `第 ${idx + 1} 組`;
                    let size = 0;

                    if (item.includes(':') || item.includes('：')) {
                        const parts = item.split(/[:：]/);
                        title = parts[0].trim();
                        size = parseInt(parts[1].trim()) || 0;
                    } else {
                        size = parseInt(item) || 0;
                    }

                    if (size > 0) {
                        const members = names.slice(pointer, pointer + size);
                        pointer += size;
                        finalGroups.push({ title, members, targetSize: size });
                    }
                });

                if (pointer < names.length) {
                    unassigned = names.slice(pointer);
                }
            }

            // 渲染結果
            resultArea.innerHTML = '';
            const colors = ['#0066FF', '#2ECC71', '#FF9F43', '#FF6B6B', '#9B59B6', '#1ABC9C'];
            
            finalGroups.forEach((group, index) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.style.borderTopColor = colors[index % colors.length];
                card.style.animationDelay = `${index * 0.1}s`;
                
                let listHtml = group.members.map(n => `<li>${n}</li>`).join('');
                card.innerHTML = `<h3>${group.title} <span>(${group.members.length}人)</span></h3><ul>${listHtml || '<li style="color:#94A3B8;list-style:none;margin-left:-20px;">無人分配</li>'}</ul>`;
                resultArea.appendChild(card);
            });

            // 若有未分配的人員
            if (unassigned.length > 0) {
                const warnCard = document.createElement('div');
                warnCard.className = 'group-card warning-card';
                warnCard.style.animationDelay = `${finalGroups.length * 0.1}s`;
                let listHtml = unassigned.map(n => `<li>${n}</li>`).join('');
                warnCard.innerHTML = `<h3>未分配名單 <span>(${unassigned.length}人)</span></h3><ul>${listHtml}</ul>`;
                resultArea.appendChild(warnCard);
            }
        }
    </script>
</body>
</html>
