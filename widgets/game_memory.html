<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記憶翻牌遊戲 | 配記</title>
    <style>
        body { margin:0; background:#FFFBEB; color:#333; font-family:-apple-system, sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding: 80px 10px 20px; user-select:none; }
        
        .top-nav { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .nav-btn { pointer-events: auto; background: rgba(245, 158, 11, 0.9); backdrop-filter: blur(10px); color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); border: none; cursor: pointer; transition: 0.2s; }
        
        .header { text-align: center; margin-bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;}
        h1 { color: #B45309; margin: 0; font-size: 2rem;}
        
        .controls { display: flex; gap: 15px; align-items: center; background: #FEF3C7; padding: 10px 20px; border-radius: 50px; flex-wrap: wrap; justify-content: center;}
        .stats { font-size: 1.1rem; font-weight: bold; color: #78350F; }
        
        select { background: white; border: 2px solid #F59E0B; padding: 6px 12px; border-radius: 10px; color: #B45309; font-weight: bold; font-size: 1rem; outline: none; cursor: pointer; }

        /* ✨ 核心魔法：使用 CSS Grid 自適應寬度 */
        .grid { 
            display: grid; 
            gap: 8px; 
            width: 100%; 
            perspective: 1000px; 
            transition: all 0.3s ease; 
            margin: 0 auto;
            justify-content: center;
        }
        
        .card { background: transparent; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .card-front { background: linear-gradient(135deg, #FCD34D, #F59E0B); color: rgba(180, 83, 9, 0.8); transform: rotateY(0deg); border: 2px solid #F59E0B; font-weight: bold;}
        .card-back { background: white; transform: rotateY(180deg); border: 2px solid #E5E7EB; }

        .btn-restart { margin-top: 30px; background: #F59E0B; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); transition: 0.2s; border: 2px solid #B45309;}
        .btn-restart:active { transform: scale(0.95); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 400px; }
        .modal-content h2 { margin-top: 0; color: #F59E0B; }
        .close-btn { width: 100%; background: #F59E0B; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 首頁</a>
        <button class="nav-btn" onclick="toggleInfo(event)">ℹ️ 說明書</button>
    </div>

    <div class="header">
        <h1>🃏 記憶翻牌遊戲</h1>
        <div class="controls">
            <select id="difficulty" onchange="initGame()">
                <option value="4">熱身 (4對)</option>
                <option value="6">容易 (6對)</option>
                <option value="8" selected>標準 (8對)</option>
                <option value="10">中等 (10對)</option>
                <option value="12">進階 (12對)</option>
                <option value="14">困難 (14對)</option>
                <option value="16">達人 (16對)</option>
                <option value="18">專家 (18對)</option>
                <option value="20">地獄 (20對)</option>
            </select>
            <div class="stats">步數: <span id="moves">0</span></div>
        </div>
    </div>

    <div class="grid" id="grid"></div>
    <button class="btn-restart" onclick="initGame()">重新開始遊戲</button>

    <div id="infoModal" class="modal" onclick="toggleInfo(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>🃏 記憶翻牌遊戲</h2>
            <p><strong>應用場景：</strong></p>
            <p>1. <strong>長者認知訓練：</strong> 訓練短期記憶力與集中力。建議由 4-8 對開始，建立成功感。<br>
               2. <strong>兒童及青年挑戰：</strong> 提升至 12 對或以上，考驗瞬間記憶與專注力。<br>
               3. <strong>復康治療：</strong> 透過 iPad 觸控螢幕進行簡單手眼協調訓練。</p>
            <button class="close-btn" onclick="toggleInfo(event)">開始訓練</button>
        </div>
    </div>

    <script>
        // 擴充圖庫至 25 個，應付 20 對的地獄級難度
        const allEmojis = [
            '🐶', '🐱', '🐭', '🐰', '🐼', '🐯', '🐸', '🐷', 
            '🐵', '🐧', '🦉', '🐝', '🦄', '🐢', '🐙', '🦋',
            '🍎', '🍓', '🍔', '🍕', '🍦', '🍩', '🚗', '🚀', '⚽'
        ];
        let cards = [], hasFlippedCard = false, lockBoard = false;
        let firstCard, secondCard;
        let moves = 0, matchedPairs = 0;

        function toggleInfo(e) {
            if(e) e.stopPropagation();
            const modal = document.getElementById('infoModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function initGame() {
            const grid = document.getElementById('grid');
            const pairsCount = parseInt(document.getElementById('difficulty').value);
            
            grid.innerHTML = '';
            moves = 0; 
            matchedPairs = 0;
            document.getElementById('moves').innerText = moves;
            
            // ✨ 動態運算卡片大小與排版 (響應式)
            let minCardSize = '75px';
            let maxWidth = '500px';
            let fontSize = '3rem';
            let qFontSize = '2rem';

            if (pairsCount > 16) {
                // 地獄級：40張卡
                minCardSize = '50px';
                maxWidth = '700px';
                fontSize = '1.8rem';
                qFontSize = '1.5rem';
            } else if (pairsCount > 10) {
                // 進階級：24-32張卡
                minCardSize = '60px';
                maxWidth = '600px';
                fontSize = '2.2rem';
                qFontSize = '1.8rem';
            } else if (pairsCount > 6) {
                // 標準級：16-20張卡
                minCardSize = '70px';
                maxWidth = '500px';
                fontSize = '2.5rem';
                qFontSize = '2rem';
            }

            // 設定 CSS 變數，等瀏覽器自動將卡片攝入位
            grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${minCardSize}, 1fr))`;
            grid.style.maxWidth = maxWidth;

            // 隨機抽取指定數量的 Emoji
            let selectedEmojis = [...allEmojis].sort(() => 0.5 - Math.random()).slice(0, pairsCount);
            cards = [...selectedEmojis, ...selectedEmojis];
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front" style="font-size: ${qFontSize}">?</div>
                        <div class="card-back" style="font-size: ${fontSize}">${emoji}</div>
                    </div>`;
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            document.getElementById('moves').innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            
            const totalPairs = parseInt(document.getElementById('difficulty').value);
            if (matchedPairs === totalPairs) {
                setTimeout(() => alert(`🎉 神乎其技！總共用了 ${moves} 步完成 ${totalPairs} 對挑戰！`), 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // 初始化遊戲
        initGame();
    </script>
</body>
</html>
