<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反應測試 | 配記</title>
    <style>
        /* 核心修復：防止手機長按反白、延遲及手勢干擾 */
        body { 
            margin:0; height:100vh; display:flex; flex-direction:column; 
            align-items:center; justify-content:center; color:white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            cursor:pointer; user-select:none; -webkit-user-select:none; 
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s; background:#CE3838;
        }
        h1 { font-size:3.5rem; text-align:center; padding:20px; margin:0; font-weight: 700; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        p { font-size:1.5rem; opacity:0.9; margin-top:10px; font-weight: 500; text-align: center; line-height: 1.5; }
        
        /* 統一懸浮導航列 */
        .top-nav { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .nav-btn { pointer-events: auto; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: 0.2s; }
        .nav-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.4); }

        /* 說明書 Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: white; color: #333; padding: 30px; border-radius: 20px; max-width: 400px; text-align: left; cursor: default; }
        .modal-content h2 { margin-top: 0; color: #0066FF; }
        .modal-content p { font-size: 1rem; line-height: 1.6; font-weight: normal; margin-bottom: 10px; }
        
        /* ✨ 新增：等級參考表樣式 */
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
        .rank-table th, .rank-table td { padding: 8px; border-bottom: 1px solid #E2E8F0; text-align: left; }
        .rank-table th { color: #0066FF; }

        .close-btn { display: block; width: 100%; background: #0066FF; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; transition: 0.2s;}
        .close-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 首頁</a>
        <button class="nav-btn" onclick="toggleInfo(event)">ℹ️ 說明書</button>
    </div>

    <h1 id="msg">點擊開始</h1>
    <p id="sub">看到綠色立即按！</p>

    <div id="infoModal" class="modal" onclick="toggleInfo(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>⚡ 反應速度測試</h2>
            <p><strong>應用場景：</strong></p>
            <p>1. <strong>特殊教育/兒童訓練：</strong> 訓練專注力與視覺刺激反應。<br>
               2. <strong>長者認知活動：</strong> 作為手眼協調評估遊戲，活躍大腦。<br>
               3. <strong>青年破冰遊戲：</strong> 測量誰的反應最快，帶動氣氛。</p>
            
            <p><strong>🏆 反應時間等級參考：</strong></p>
            <table class="rank-table">
                <tr><th>時間 (毫秒)</th><th>等級評估</th></tr>
                <tr><td>&lt; 200 ms</td><td>⚡ 神級反應 (超越常人)</td></tr>
                <tr><td>200 - 250 ms</td><td>🏃 職業運動員級別</td></tr>
                <tr><td>251 - 350 ms</td><td>🐅 敏捷如虎 (非常優秀)</td></tr>
                <tr><td>351 - 500 ms</td><td>🚶 健康水平 (正常發揮)</td></tr>
                <tr><td>&gt; 500 ms</td><td>🐢 需要多加訓練囉！</td></tr>
            </table>

            <button class="close-btn" onclick="toggleInfo(event)">明白，開始測試</button>
        </div>
    </div>

    <script>
        let state = 'waiting'; // waiting, ready, green, result
        let startTime, timer;
        const msg = document.getElementById('msg');
        const sub = document.getElementById('sub');

        function toggleInfo(e) {
            e.stopPropagation();
            const modal = document.getElementById('infoModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // ✨ 新增：等級判斷邏輯
        function getRank(time) {
            if (time < 200) return "⚡ 神級反應 (超越常人！)";
            if (time <= 250) return "🏃 職業運動員級別！";
            if (time <= 350) return "🐅 敏捷如虎 (非常優秀)";
            if (time <= 500) return "🚶 健康水平 (正常發揮)";
            if (time <= 800) return "🐢 繼續努力 (當作熱身吧)";
            return "🦥 樹懶級別 (需要多加訓練囉)";
        }

        function handleClick(e) {
            if (e.target.closest('.top-nav') || e.target.closest('.modal')) return;
            e.preventDefault(); 
            if (state === 'waiting' || state === 'result') {
                startGame();
            } else if (state === 'ready') {
                resetGame('太早了！', '請等待畫面變綠...<br>點擊重試', '#CE3838');
                clearTimeout(timer);
            } else if (state === 'green') {
                let time = Date.now() - startTime;
                let rank = getRank(time);
                // ✨ 將等級顯示在時間下方
                resetGame(time + ' 毫秒', rank + '<br><span style="font-size:1rem; opacity:0.8; display:block; margin-top:10px;">👇 點擊螢幕再玩一次</span>', '#007AFF');
            }
        }

        function startGame() {
            state = 'ready';
            document.body.style.backgroundColor = '#CE3838'; // Red
            msg.innerText = '等待綠燈...';
            sub.innerText = '準備...';
            
            let randomTime = 2000 + Math.random() * 3000;
            timer = setTimeout(() => {
                state = 'green';
                document.body.style.backgroundColor = '#34C759'; // Green
                msg.innerText = '按下去！';
                sub.innerText = '';
                startTime = Date.now();
            }, randomTime);
        }

        function resetGame(text, subtext, color) {
            state = 'result';
            document.body.style.backgroundColor = color;
            msg.innerText = text;
            sub.innerHTML = subtext; // 改用 innerHTML 以支援 <br> 換行
        }

        // 綁定事件確保手機觸控極速反應
        document.body.addEventListener('touchstart', handleClick, {passive: false});
        document.body.addEventListener('mousedown', handleClick);
    </script>
</body>
</html>
